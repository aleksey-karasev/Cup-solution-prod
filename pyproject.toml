[project]
name = "ecup-prod"
version = "0.0.1"
description = "Ozon E-CUP 2026 production pipeline: training and inference"
requires-python = "==3.13.*"
dependencies = [
    "catboost>=1.2.10",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.1",
    "numba>=0.67",
    "numpy>=2.5.2",
    "nvidia-ml-py>=12.560.30",
    "optuna>=4.9.0",
    "polars>=1.43.2",
    "psutil>=6.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "xgboost>=3.4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pre-commit", "ruff", "ty"]
